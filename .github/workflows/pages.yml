name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'netlify-ready/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: netlify-ready
    env:
      SITE_URL: https://haythemidi.dev
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: netlify-ready/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build portfolio
        run: npm run build
      - name: Check pages and interactions
        run: npm run check
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: netlify-ready/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
